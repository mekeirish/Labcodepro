<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Labcode — Component Sandbox</title>
    
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deep: {
                            900: '#0b0b0d',
                            800: '#0f0f11',
                            700: '#141418',
                            600: '#16161a',
                            500: '#1a1a1f',
                        },
                        cyber: {
                            violet: '#8b5cf6',
                            'violet-hover': '#7c3aed',
                            amber: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neu-dark': 'inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 20px rgba(0,0,0,0.6)',
                        'neu-pressed': 'inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.03)',
                        'glow-violet': '0 0 10px rgba(139,92,246,0.3), 0 0 20px rgba(139,92,246,0.1)',
                        'glow-amber': '0 0 8px rgba(245,158,11,0.3), 0 0 16px rgba(245,158,11,0.1)',
                        'frame': '0 4px 20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03)',
                    },
                }
            }
        }
    </script>
    
    <style>
        body {
            background: radial-gradient(ellipse at 50% 0%, #121218 0%, #0b0b0d 70%);
            letter-spacing: -0.01em;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 2px;
        }
        
        .btn-press {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            transform: scale(0.97);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.03);
        }
        
        @keyframes pulse-violet {
            0% { box-shadow: 0 0 6px rgba(139,92,246,0.3), 0 0 16px rgba(139,92,246,0.1); }
            50% { box-shadow: 0 0 12px rgba(139,92,246,0.5), 0 0 28px rgba(139,92,246,0.2); }
            100% { box-shadow: 0 0 6px rgba(139,92,246,0.3), 0 0 16px rgba(139,92,246,0.1); }
        }
        
        .animate-pulse-violet {
            animation: pulse-violet 2.2s infinite;
        }
        
        textarea.editor-code {
            tab-size: 2;
            caret-color: #8b5cf6;
        }
        textarea.editor-code::selection {
            background: rgba(139,92,246,0.35);
            color: #fff;
        }
        
        input:focus, textarea:focus {
            box-shadow: 0 0 0 1.5px rgba(139,92,246,0.3), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        
        .log-err { 
            color: #ef4444; 
            border-left: 2px solid #ef4444; 
            padding-left: 8px; 
        }
        .log-warn { 
            color: #f59e0b; 
            border-left: 2px solid #f59e0b; 
            padding-left: 8px; 
        }
        .log-info { 
            color: #8b5cf6; 
        }
        
        .tab-btn.active {
            background: #141418;
            color: #f59e0b;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b0d">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="font-sans text-zinc-100 antialiased h-screen h-[100dvh] flex flex-col p-2.5">

    <!-- Conteneur principal pleine hauteur -->
    <div class="w-full max-w-lg mx-auto flex flex-col h-full gap-2">

        <!-- En-tête compact (ajouté dans le style du second code) -->
        <div class="flex items-center gap-2 flex-shrink-0 px-1">
            <div class="w-2 h-2 bg-cyber-violet rounded-full shadow-glow-violet animate-pulse flex-shrink-0"></div>
            <h1 class="text-base font-bold tracking-[0.12em] text-white uppercase">Labcode</h1>
            <span class="ml-auto text-[9px] text-zinc-700 font-mono uppercase tracking-wider">Component Sandbox</span>
        </div>

        <!-- Barre d'onglets ultra-compacte -->
        <div class="flex gap-1.5 p-1 bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl 
                    shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] flex-shrink-0">
            <button class="tab-btn active flex-1 py-2 px-3 rounded-lg font-semibold text-[11px] uppercase tracking-[0.08em] 
                           transition-all duration-200 text-zinc-600"
                    id="tabSandbox" onclick="switchTab('editor-tab')">
                🧪 Sandbox
            </button>
            <button class="tab-btn flex-1 py-2 px-3 rounded-lg font-semibold text-[11px] uppercase tracking-[0.08em] 
                           transition-all duration-200 text-zinc-600"
                    id="tabExtractor" onclick="switchTab('extractor-tab')">
                ✂️ Extract
            </button>
        </div>

        <!-- Onglet Sandbox -->
        <div id="editor-tab" class="tab-content flex flex-col gap-2 flex-1 min-h-0">
            
            <!-- Éditeur -->
            <div class="bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl p-3 shadow-neu-dark flex flex-col flex-[1.2] min-h-0">
                <div class="flex items-center justify-between mb-1.5 flex-shrink-0">
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-cyber-violet rounded-full shadow-glow-violet"></span>
                        <span class="text-[10px] font-semibold uppercase tracking-[0.1em] text-zinc-500">Code Source</span>
                    </div>
                    <span class="text-[9px] text-zinc-700 font-mono" id="charCount">0 car.</span>
                </div>
                <textarea id="sandboxCode" 
                          placeholder="Colle ton code HTML/CSS/JS..." 
                          oninput="autoSaveSandbox(); updateCharCount()"
                          class="editor-code flex-1 w-full bg-deep-800 border border-zinc-800/40 rounded-lg p-2.5 
                                 text-zinc-300 font-mono text-[12px] leading-[18px] resize-none
                                 shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] 
                                 placeholder:text-zinc-700 focus:text-zinc-100
                                 focus:outline-none transition-all duration-200 min-h-0"></textarea>
                <div class="flex gap-2 mt-2 flex-shrink-0">
                    <button class="btn-press flex-[0.8] py-2.5 bg-deep-500 border border-zinc-700/40 rounded-lg 
                                   text-zinc-400 hover:text-white font-semibold text-[10px] uppercase tracking-[0.08em]
                                   transition-all duration-200 flex items-center justify-center gap-1"
                            onclick="pasteClipboard()">
                        📋 Coller
                    </button>
                    <button class="btn-press flex-[2] py-2.5 bg-cyber-violet rounded-lg text-white font-bold text-[11px] uppercase tracking-[0.1em]
                                   shadow-glow-violet animate-pulse-violet hover:bg-cyber-violet-hover
                                   transition-all duration-200 flex items-center justify-center gap-1.5"
                            onclick="runSandbox()">
                        ⚡ Exécuter
                    </button>
                </div>
            </div>

            <!-- Preview -->
            <div class="bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl p-2.5 shadow-neu-dark flex flex-col flex-[0.9] min-h-0">
                <div class="flex items-center justify-between mb-1.5 flex-shrink-0">
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_6px_rgba(16,185,129,0.4)]"></span>
                        <span class="text-[10px] font-semibold uppercase tracking-[0.1em] text-zinc-500">Rendu Live</span>
                    </div>
                </div>
                <div class="relative flex-1 rounded-lg overflow-hidden shadow-frame bg-white min-h-0" id="previewContainer">
                    <iframe id="labPreview" class="w-full h-full border-none bg-white"></iframe>
                    <button class="absolute bottom-2 right-2 w-8 h-8 rounded-full 
                                   bg-deep-800/90 backdrop-blur-sm border border-zinc-700/40
                                   text-cyber-amber hover:text-white text-sm font-bold
                                   flex items-center justify-center cursor-pointer
                                   shadow-[0_2px_8px_rgba(0,0,0,0.5)] transition-all duration-200 z-10 btn-press"
                            id="fsBtn" onclick="toggleFullscreen()" title="Plein écran">
                        ⛶
                    </button>
                </div>
            </div>

            <!-- Console -->
            <div class="bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl p-2.5 shadow-neu-dark flex flex-col flex-[0.6] min-h-0">
                <div class="flex items-center justify-between mb-1 flex-shrink-0">
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-cyber-amber rounded-full shadow-glow-amber"></span>
                        <span class="text-[10px] font-semibold uppercase tracking-[0.1em] text-zinc-500">Console</span>
                    </div>
                    <button class="text-[9px] text-zinc-600 hover:text-red-400 transition-colors font-medium"
                            onclick="clearConsole()">
                        🗑️ Clear
                    </button>
                </div>
                <div id="consoleLog" 
                     class="flex-1 bg-deep-800 border border-zinc-800/40 rounded-lg p-2 
                            text-[10px] font-mono leading-relaxed overflow-y-auto
                            shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] min-h-0">
                    <div class="text-zinc-600">> Console prête...</div>
                </div>
            </div>
        </div>

        <!-- Onglet Extractor -->
        <div id="extractor-tab" class="tab-content hidden flex-col gap-2 flex-1 min-h-0">
            
            <!-- Source -->
            <div class="bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl p-3 shadow-neu-dark flex flex-col flex-[0.9] min-h-0">
                <div class="flex items-center gap-1.5 mb-1.5 flex-shrink-0">
                    <span class="w-1.5 h-1.5 bg-cyber-violet rounded-full shadow-glow-violet"></span>
                    <span class="text-[10px] font-semibold uppercase tracking-[0.1em] text-zinc-500">Source HTML</span>
                </div>
                <textarea id="rawSource" rows="3" placeholder="Colle un code HTML complet..."
                          class="editor-code flex-1 w-full bg-deep-800 border border-zinc-800/40 rounded-lg p-2.5 
                                 text-zinc-300 font-mono text-[12px] leading-[18px] resize-none
                                 shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] 
                                 placeholder:text-zinc-700 focus:text-zinc-100
                                 focus:outline-none transition-all duration-200 min-h-0 mb-2"></textarea>
                <div class="grid grid-cols-3 gap-1.5 flex-shrink-0">
                    <button class="btn-press py-2.5 bg-deep-500 border border-zinc-700/40 rounded-lg
                                   text-cyber-violet font-semibold text-[10px] uppercase tracking-[0.06em]
                                   hover:bg-cyber-violet/10 hover:text-white transition-all duration-200 text-center"
                            onclick="extractBlock('style')">
                        🎨 CSS
                    </button>
                    <button class="btn-press py-2.5 bg-deep-500 border border-zinc-700/40 rounded-lg
                                   text-cyber-violet font-semibold text-[10px] uppercase tracking-[0.06em]
                                   hover:bg-cyber-violet/10 hover:text-white transition-all duration-200 text-center"
                            onclick="extractBlock('script')">
                        ⚙️ JS
                    </button>
                    <button class="btn-press py-2.5 bg-deep-500 border border-zinc-700/40 rounded-lg
                                   text-cyber-violet font-semibold text-[10px] uppercase tracking-[0.06em]
                                   hover:bg-cyber-violet/10 hover:text-white transition-all duration-200 text-center"
                            onclick="extractBlock('body')">
                        📱 Body
                    </button>
                </div>
            </div>

            <!-- Résultat -->
            <div class="bg-deep-600/90 backdrop-blur-sm border border-zinc-800/60 rounded-xl p-3 shadow-neu-dark flex flex-col flex-[1.1] min-h-0">
                <div class="flex items-center gap-1.5 mb-1.5 flex-shrink-0">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full shadow-[0_0_6px_rgba(16,185,129,0.4)]"></span>
                    <span class="text-[10px] font-semibold uppercase tracking-[0.1em] text-zinc-500">Résultat</span>
                </div>
                <textarea id="extractionResult" readonly placeholder="Le bloc extrait apparaîtra ici..."
                          class="editor-code flex-1 w-full bg-deep-800 border border-zinc-800/40 rounded-lg p-2.5 
                                 text-zinc-300 font-mono text-[12px] leading-[18px] resize-none
                                 shadow-[inset_0_1px_3px_rgba(0,0,0,0.5)] 
                                 placeholder:text-zinc-700
                                 focus:outline-none transition-all duration-200 min-h-0 mb-2"></textarea>
                <button class="btn-press w-full py-2.5 bg-cyber-amber rounded-lg text-deep-900 font-bold text-[11px] uppercase tracking-[0.1em]
                               shadow-glow-amber hover:bg-amber-400 transition-all duration-200 flex items-center justify-center gap-1.5 flex-shrink-0"
                        onclick="copyExtraction()">
                    📋 Copier
                </button>
            </div>
        </div>

        <!-- Signature ultra-compacte -->
        <div class="text-center flex-shrink-0 pb-1">
            <p class="text-[9px] text-zinc-800 tracking-[0.12em] font-medium uppercase">
                LD Holding <span class="text-zinc-700">· 2026</span>
            </p>
        </div>
    </div>

    <script>
        // =============================================
        // LOGIQUE MÉTIER — STRICTEMENT PRÉSERVÉE
        // =============================================

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => {
                c.classList.add('hidden');
                c.classList.remove('flex');
            });
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.style.background = '';
                b.style.color = '';
                b.style.boxShadow = '';
            });
            
            const target = document.getElementById(tabId);
            target.classList.remove('hidden');
            target.classList.add('flex', 'flex-col');
            
            const activeBtn = event.target;
            activeBtn.classList.add('active');
            activeBtn.style.background = '#141418';
            activeBtn.style.color = '#f59e0b';
            activeBtn.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.03), 0 2px 6px rgba(0,0,0,0.4)';
        }

        function updateCharCount() {
            const count = document.getElementById('sandboxCode').value.length;
            document.getElementById('charCount').textContent = `${count} car.`;
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const textarea = document.getElementById('sandboxCode');
                textarea.value = text;
                autoSaveSandbox();
                updateCharCount();
                consoleLogger("Code collé avec succès.");
            } catch (err) {
                consoleLogger("Erreur accès presse-papiers", "error");
            }
        }

        const consoleLogger = (msg, type = "info") => {
            const consoleEl = document.getElementById('consoleLog');
            if (!consoleEl) return;
            let classType = "log-info";
            let prefix = "> ";
            if (type === "error") { classType = "log-err"; prefix = "❌ "; }
            if (type === "warn") { classType = "log-warn"; prefix = "⚠️ "; }
            consoleEl.innerHTML += `<div class="${classType}">${prefix}${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        };

        function clearConsole() { 
            document.getElementById('consoleLog').innerHTML = "<div class=\"text-zinc-600\">> Console vidée.</div>"; 
        }

        function runSandbox() {
            const code = document.getElementById('sandboxCode').value;
            const iframe = document.getElementById('labPreview');
            clearConsole();
            consoleLogger("Compilation en cours...", "warn");

            const hookScript = `<script>window.onerror = function(m,s,l,c,e){window.parent.postMessage({type:'error',data:m+" (Ligne "+l+")"},'*');return false;}; console.log = function(...args){window.parent.postMessage({type:'log',data:args.join(' ')},'*');};<\/script>`;

            let finalCode = code.includes('<head>') ? code.replace('<head>', '<head>' + hookScript) : hookScript + code;
            const blob = new Blob([finalCode], { type: 'text/html' });
            iframe.src = URL.createObjectURL(blob);
            
            const container = document.getElementById('previewContainer');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            }
        }

        window.addEventListener('message', function(e) { if (e.data && e.data.type) consoleLogger(e.data.data, e.data.type); });

        function toggleFullscreen() {
            const container = document.getElementById('previewContainer');
            const btn = document.getElementById('fsBtn');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                btn.style.color = '#ef4444';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                btn.style.color = '#f59e0b';
            }
        }

        function onFsChange() {
            const btn = document.getElementById('fsBtn');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) btn.style.color = '#f59e0b';
            else btn.style.color = '#ef4444';
        }
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);

        function autoSaveSandbox() { 
            localStorage.setItem('sniper_sandbox_cache', document.getElementById('sandboxCode').value); 
        }

        function extractBlock(type) {
            const source = document.getElementById('rawSource').value;
            const resultArea = document.getElementById('extractionResult');
            if(!source) { alert("Veuillez coller du code source au préalable."); return; }
            let regex = type === 'style' ? /<style[^>]*>([\s\S]*?)<\/style>/gi : type === 'script' ? /<script[^>]*>([\s\S]*?)<\/script>/gi : /<body[^>]*>([\s\S]*?)<\/body>/gi;
            let matches = []; let match;
            while ((match = regex.exec(source)) !== null) matches.push(match[1].trim());
            if (matches.length > 0) { resultArea.value = matches.join("\n\n/* --- Bloc --- */\n\n"); }
            else { alert(`Aucun bloc <${type}> trouvé.`); }
        }

        function copyExtraction() {
            const res = document.getElementById('extractionResult');
            if(!res.value) return;
            navigator.clipboard.writeText(res.value);
            alert("Composant copié !");
        }

        window.onload = function() {
            const cached = localStorage.getItem('sniper_sandbox_cache');
            if (cached) {
                document.getElementById('sandboxCode').value = cached;
                updateCharCount();
            }
        };
    </script>

    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
